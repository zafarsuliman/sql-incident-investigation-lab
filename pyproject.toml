[project]
name = "sql-incident-investigation-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["streamlit==1.65.0", "pandas==2.3.3", "pyarrow==23.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.14.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

